name: app

on:
  push:
    branches: [main]
    paths: ["app/**"]
  pull_request:
    paths: ["app/**"]
  workflow_dispatch:
    inputs:
      failure_mode:
        description: Failure mode baked into the image (demo)
        type: choice
        options: [none, health, delayed]
        default: none

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ecs-supply-chain
  ECS_CLUSTER: ecs-supply-chain
  ECS_SERVICE: ecs-supply-chain
  APP_DEPLOY_ROLE: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/ecs-supply-chain-gh-app-deploy
  CERT_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/app.yml@refs/heads/main

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  build:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    env:
      FAILURE_MODE: ${{ inputs.failure_mode || 'none' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute version
        id: version
        run: |
          VERSION=$(cat app/VERSION)
          TAG="$VERSION-${GITHUB_SHA::7}"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$TAG-$FAILURE_MODE-$GITHUB_RUN_NUMBER"
          fi
          if [[ "$FAILURE_MODE" != "none" ]]; then
            VERSION="$VERSION-$FAILURE_MODE"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          docker build -t "app:${{ steps.version.outputs.tag }}" \
            --build-arg APP_VERSION="${{ steps.version.outputs.version }}" \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            --build-arg FAILURE_MODE="$FAILURE_MODE" \
            app/

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0

      - name: Trivy scan (fail on CRITICAL)
        run: trivy image --severity CRITICAL --exit-code 1 "app:${{ steps.version.outputs.tag }}"

      - name: SBOM (CycloneDX)
        run: trivy image --format cyclonedx --output sbom.cdx.json "app:${{ steps.version.outputs.tag }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ steps.version.outputs.tag }}
          path: sbom.cdx.json

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: github.event_name != 'pull_request'
        with:
          role-to-assume: ${{ env.APP_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        if: github.event_name != 'pull_request'
        id: ecr

      - name: Push to ECR
        if: github.event_name != 'pull_request'
        id: push
        run: |
          REMOTE="${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY:${{ steps.version.outputs.tag }}"
          docker tag "app:${{ steps.version.outputs.tag }}" "$REMOTE"
          docker push "$REMOTE"
          IMAGE=$(docker inspect --format '{{index .RepoDigests 0}}' "$REMOTE")
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Pushed \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request'

      - name: Sign image and attest SBOM (keyless)
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.push.outputs.image }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE"

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency: ecs-deploy
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.APP_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify signature and deploy (blue/green with bake time)
        run: scripts/deploy.sh "${{ needs.build.outputs.image }}"
